name: ingredient-validation

on:
  push:
    branches:
      - work/ingredient-archive-spec-v2-20261118

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile app and run focused unit tests
        run: ./gradlew :core:database:testDebugUnitTest :core:data:testDebugUnitTest :feature:ingredients:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: misebase-ingredient-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
