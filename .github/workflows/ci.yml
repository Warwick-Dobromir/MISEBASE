name: ci

on:
  push:
    branches: [main, master, feat/ingredient-detail-rebuild-20261121, work/inventory-subcategory-full-20261125, fix/inventory-archive-reference-match-20261125, fix/inventory-archive-reference-implementation-20261126, fix/scan-multiframe-checksum-20261125, feat/pending-stock-20261126, feat/scan-mode-feedback-20261126, feat/custom-unit-management-20261126, feat/inventory-cu-location-capacity-20261126]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Code quality and tests
        run: ./gradlew ktlintCheck detekt lintDebug test --no-daemon
      - name: Scan module tests and style (independent diagnostic)
        if: always()
        run: ./gradlew :feature:scan:testDebugUnitTest --no-daemon
