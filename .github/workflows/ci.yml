name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Quality gates
        run: ./gradlew ktlintCheck detekt lintDebug test assembleDebug --no-daemon
      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease --no-daemon

  verified-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, lint, and test
        run: ./gradlew detekt lintDebug testDebugUnitTest assembleDebug --no-daemon
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MISEBASE-ingredient-fix-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
