name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      MISEBASE_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
      MISEBASE_RELEASE_STORE_PASSWORD: ${{ secrets.MISEBASE_RELEASE_STORE_PASSWORD }}
      MISEBASE_RELEASE_KEY_ALIAS: ${{ secrets.MISEBASE_RELEASE_KEY_ALIAS }}
      MISEBASE_RELEASE_KEY_PASSWORD: ${{ secrets.MISEBASE_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Require original release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MISEBASE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing MISEBASE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$MISEBASE_RELEASE_STORE_PASSWORD" || { echo "Missing MISEBASE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$MISEBASE_RELEASE_KEY_ALIAS" || { echo "Missing MISEBASE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$MISEBASE_RELEASE_KEY_PASSWORD" || { echo "Missing MISEBASE_RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MISEBASE_RELEASE_STORE_FILE"
          chmod 600 "$MISEBASE_RELEASE_STORE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with original MISEBASE release key
        run: ./gradlew :app:assembleDebug -PdebugWithReleaseSigning=true --no-daemon

      - name: Publish APK as downloadable release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-signed-${{ github.run_number }}
          name: MISEBASE Android Signed ${{ github.run_number }}
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
