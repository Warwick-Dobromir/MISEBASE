name: Android APK
# Build the pending-stock inventory workflow.
# Re-run signed build after repository signing secrets were configured.
# Rebuild after coroutine-safe archive auto-scroll correction.

on:
  push:
    branches: [main, feat/ingredient-detail-rebuild-20261121, fix/archive-category-interactions, fix/archive-sort-feedback, build/pen-flip-90fb110, ui/subcategory-search-sort-20261118, fix/archive-sort-autoscroll-20261118, fix/archive-sort-elastic-20261118, fix/archive-sort-save-actions-20261118, fix/detail-relations-follow-editor-state, work/inventory-subcategory-full-20261125, fix/inventory-archive-reference-match-20261125, fix/inventory-archive-reference-implementation-20261126, fix/inventory-archive-edit-layout-20261126, fix/scan-multiframe-checksum-20261125, feat/pending-stock-20261126, feat/scan-mode-feedback-20261126, feat/scan-feedback-layout-c-20261126, fix/scan-unified-photo-feedback-20261126, fix/pending-stock-bottom-sheet-layout-20261126, feat/custom-unit-management-20261126, feat/inventory-cu-location-capacity-20261126]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      MISEBASE_RELEASE_STORE_PASSWORD: ${{ secrets.MISEBASE_RELEASE_STORE_PASSWORD }}
      MISEBASE_RELEASE_KEY_ALIAS: ${{ secrets.MISEBASE_RELEASE_KEY_ALIAS }}
      MISEBASE_RELEASE_KEY_PASSWORD: ${{ secrets.MISEBASE_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout requested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require original release signing secrets
        env:
          MISEBASE_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_BASE64: ${{ secrets.MISEBASE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing MISEBASE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$MISEBASE_RELEASE_STORE_PASSWORD" || { echo "Missing MISEBASE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$MISEBASE_RELEASE_KEY_ALIAS" || { echo "Missing MISEBASE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$MISEBASE_RELEASE_KEY_PASSWORD" || { echo "Missing MISEBASE_RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MISEBASE_RELEASE_STORE_FILE"
          chmod 600 "$MISEBASE_RELEASE_STORE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with original MISEBASE release key
        env:
          MISEBASE_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
        run: ./gradlew :app:assembleDebug -PdebugWithReleaseSigning=true --no-daemon

      - name: Verify original MISEBASE signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.culinary' versionCode='13' versionName='1.2.1'"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\\n' "$CERT_OUTPUT"
          ACTUAL="$(printf '%s\\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest:' | head -n 1 | sed -E 's/.*digest:[[:space:]]*//' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' '5C:A4:19:59:D9:F4:50:CD:C8:51:DC:B9:F0:52:AC:91:30:AA:EA:B7:1C:64:06:21:73:A6:99:35:50:56:AF:61' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          echo "Actual signing certificate: $ACTUAL"
          echo "Expected signing certificate: $EXPECTED"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "Verified package, version, and original signing certificate: $ACTUAL"

      - name: Upload rebuilt APK for download
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MISEBASE-expiry-reminder-20261127
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Replace latest APK and remove the other 21 releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP_TAG="mobile-build-signed-52"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          gh release view "$KEEP_TAG" >/dev/null

          # Point the retained tag at the exact source commit used for this APK.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${KEEP_TAG}" \
            --method PATCH --field sha="${GITHUB_SHA}" --field force=true >/dev/null

          # Recreate the release so its Published timestamp reflects this build,
          # instead of leaving yesterday's timestamp on a replaced asset.
          gh release delete "$KEEP_TAG" --yes
          gh release create "$KEEP_TAG" "$APK" \
            --title "MISEBASE Android 安装包" \
            --notes "Build commit: ${GITHUB_SHA}\nOriginal MISEBASE signing certificate verified."

          # Delete every other release/tag only after the replacement asset is live.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name != "mobile-build-signed-52") | .tag_name' |
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            echo "Removing old release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag
          done
          REMAINING="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'length')"
          test "$REMAINING" = "1"
          gh release view "$KEEP_TAG" --json tagName,assets --jq '.tagName + " assets=" + (.assets | length | tostring)'
