name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publish APK as downloadable release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: MISEBASE Android ${{ github.run_number }}
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
