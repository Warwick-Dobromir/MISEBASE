name: Android APK

on:
  push:
    branches: [ui/ingredient-detail-display]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test and quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all unit tests and quality gates
        run: ./gradlew test ktlintCheck detekt --no-daemon

  build-apk:
    name: Build and verify installable APK
    needs: test
    runs-on: ubuntu-latest
    env:
      MISEBASE_RELEASE_STORE_PASSWORD: ${{ secrets.MISEBASE_RELEASE_STORE_PASSWORD }}
      MISEBASE_RELEASE_KEY_ALIAS: ${{ secrets.MISEBASE_RELEASE_KEY_ALIAS }}
      MISEBASE_RELEASE_KEY_PASSWORD: ${{ secrets.MISEBASE_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout tested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require original release signing secrets
        env:
          MISEBASE_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_BASE64: ${{ secrets.MISEBASE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing MISEBASE_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$MISEBASE_RELEASE_STORE_PASSWORD" || { echo "Missing MISEBASE_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$MISEBASE_RELEASE_KEY_ALIAS" || { echo "Missing MISEBASE_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$MISEBASE_RELEASE_KEY_PASSWORD" || { echo "Missing MISEBASE_RELEASE_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MISEBASE_RELEASE_STORE_FILE"
          chmod 600 "$MISEBASE_RELEASE_STORE_FILE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with original MISEBASE release key
        env:
          MISEBASE_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
        run: ./gradlew :app:assembleDebug -PdebugWithReleaseSigning=true --no-daemon

      - name: Verify package, version, and original signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.culinary' versionCode='11' versionName='1.1.0'"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\\n' "$CERT_OUTPUT"
          ACTUAL="$(printf '%s\\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest:' | head -n 1 | sed -E 's/.*digest:[[:space:]]*//' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' '5C:A4:19:59:D9:F4:50:CD:C8:51:DC:B9:F0:52:AC:91:30:AA:EA:B7:1C:64:06:21:73:A6:99:35:50:56:AF:61' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          echo "Actual signing certificate: $ACTUAL"
          echo "Expected signing certificate: $EXPECTED"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MISEBASE-ingredient-detail-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
