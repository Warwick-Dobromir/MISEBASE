name: ingredient-tests

on:
  push:
    branches:
      - work/ingredient-archive-spec-v2-20261118

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run database, data and ingredient feature tests
        run: ./gradlew :core:database:testDebugUnitTest :core:data:testDebugUnitTest :feature:ingredients:testDebugUnitTest --stacktrace
