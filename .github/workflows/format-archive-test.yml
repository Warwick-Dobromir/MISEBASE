name: format-archive-test
on:
  push:
    branches:
      - work/ingredient-archive-spec-v2-20261118
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ingredient-archive-spec-v2-20261118
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:ktlintTestSourceSetFormat --no-daemon
      - name: Commit formatter output if needed
        run: |
          if ! git diff --quiet -- app/src/test/java/com/culinary/kitchen/archive/ArchiveAutoScrollVelocityTest.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/test/java/com/culinary/kitchen/archive/ArchiveAutoScrollVelocityTest.kt
            git commit -m "style(test): format archive auto-scroll tests"
            git push origin HEAD:work/ingredient-archive-spec-v2-20261118
          fi
