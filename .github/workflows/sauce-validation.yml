name: sauce-validation

on:
  pull_request:
    paths:
      - "feature/sauces/**"
      - "core/domain/**"
      - ".github/workflows/sauce-validation.yml"
  push:
    branches:
      - fix/sauce-research-notes-fields-20261119
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sauce-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply ktlint formatting to sauce module
        run: ./gradlew :feature:sauces:ktlintFormat --no-daemon
      - name: Commit sauce formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/sauces/src
          if ! git diff --cached --quiet; then
            git commit -m "style(sauces): apply ktlint formatting"
            git push origin HEAD:fix/sauce-research-notes-fields-20261119
          fi
      - name: Validate sauce domain and editor
        run: |
          ./gradlew \
            :core:domain:test \
            :feature:sauces:testDebugUnitTest \
            :feature:sauces:ktlintMainSourceSetCheck \
            :feature:sauces:ktlintTestDebugSourceSetCheck \
            :app:assembleRelease \
            --no-daemon || {
              echo "---- Sauce main ktlint report ----"
              cat feature/sauces/build/reports/ktlint/ktlintMainSourceSetCheck/ktlintMainSourceSetCheck.txt || true
              echo "---- Sauce test ktlint report ----"
              cat feature/sauces/build/reports/ktlint/ktlintTestDebugSourceSetCheck/ktlintTestDebugSourceSetCheck.txt || true
              exit 1
            }
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: MISEBASE-sauce-validation-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
