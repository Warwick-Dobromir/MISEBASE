build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    threshold: 60
  LongParameterList:
    active: false
  TooManyFunctions:
    thresholdInFiles: 20
    # Room 的 @Database 类必须为每个 DAO 暴露一个访问器；v1 有 31 张表。
    thresholdInClasses: 35

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    active: false
  # 允许守卫式提前返回：前置检查（未命中/已访问/缺失）不算"多出口"。
  ReturnCount:
    max: 4
    excludeGuardClauses: true
