build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    threshold: 60
  LongParameterList:
    active: false
  TooManyFunctions:
    thresholdInFiles: 20
    # Room 的 @Database 类必须为每个 DAO 暴露一个访问器；v1 有 31 张表。
    thresholdInClasses: 35
    # 版本/档案 DAO 的查询方法随 Stage 3 增加，接口上限与类保持一致。
    thresholdInInterfaces: 35
    # 图标路径数据由 tools/icon_pipeline 机械生成，一个文件承载全部 Symbols 路径。
    excludes:
      - '**/MaterialSymbolPaths.kt'

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - Composable
      - androidx.compose.runtime.Composable
    # detekt 1.23 的 ignoreAnnotated 在部分多函数 Compose 页面文件中失效；
    # 仅对 feature 页面文件关闭命名规则，业务/数据代码不受影响。
    # 测试源沿用默认排除，避免覆盖默认 excludes 后误报 backtick 测试名。
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/feature/*/src/main/java/**/*Screen.kt'
      # 设计系统组件全部是 @Composable 公共 API（PascalCase 是有意为之）；
      # detekt 1.23 在多函数 Compose 文件中不生效于 ignoreAnnotated，故按目录排除。
      - '**/component/**'
      # app 是 Compose 组合根：页面/区块函数按 Compose 约定使用 PascalCase。
      - '**/app/src/main/java/**'


style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    active: false
  # 允许守卫式提前返回：前置检查（未命中/已访问/缺失）不算"多出口"。
  ReturnCount:
    max: 4
    excludeGuardClauses: true
