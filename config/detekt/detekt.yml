build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LongMethod:
    threshold: 60
  LongParameterList:
    active: false
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    active: false
